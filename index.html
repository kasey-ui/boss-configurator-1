     ],
    },
    {key:'rear-finish', label:'Rear Bumper Finish', badge:'req',
     mirror:'front-finish',
     condition:(sel)=>!!sel['rear-parking'],
     choices:()=>finishChoices,
    },

    // ── ACCESSORIES ───────────────────────────────────────────
    {key:'front-lp', label:'License Plate Bracket', badge:'opt',
     condition:(sel)=>{
       if(!hasFront(sel['bumper-position'])||!sel['front-finish']) return false;
       if(sel['bumper-position']==='front-rear') return !!sel['rear-finish'];
       return true;
     },
     choices:()=>[
       {val:'no',  label:'No License Plate Bracket'},
       {val:'yes', label:'Add License Plate Bracket (31910)', sub:'Honeycomb Mesh — No Charge', parts:[{pn:'31910',qty:1}]},
     ],
    },
    {key:'front-wing-lights', label:'Outer Wing Lights', badge:'opt',
     condition:(sel)=>hasFront(sel['bumper-position'])&&!!sel['front-lp'],
     choices:()=>wingLightChoices(4),
    },
    {key:'front-hooks', label:'Front Tow Hooks', badge:'opt',
     mirror:'',
     condition:(sel)=>{
       if(!hasFront(sel['bumper-position'])||!sel['front-lp']) return false;
       if(sel['front-series']==='bravo') return sel['front-face']==='clevis';
       return true;
     },
     choices:()=>hookChoices,
    },
    {key:'rear-lights', label:'Rear Bumper Lights', badge:'opt',
     mirror:'front-wing-lights',
     condition:(sel)=>!!sel['rear-finish'],
     choices:()=>wingLightChoices(2),
    },
    {key:'rear-hooks', label:'Rear Bumper Hooks', badge:'opt',
     mirror:'front-hooks',
     condition:(sel)=>!!sel['rear-finish']&&(sel['rear-series']==='alpha'||sel['rear-face']==='clevis'),
     choices:()=>hookChoices,
    },
  ];

  return {
    id, yr_from, yr_to, make, model, label,
    kits:[{id:`${id}-kit`, label:'Bumper Configuration', sub:'Alpha & Bravo Series — front and rear bumpers with accessories'}],
    steps,
    buildParts:(kit,sel)=>{
      const parts = [];
      const bp    = sel['bumper-position']||'';
      const hookPN = {sw1b:'MH-SW1B',sw1c:'MH-SW1C',sw1s:'MH-SW1S',sw1a:'MH-SW1A',sw1r:'MH-SW1R',rs78xlb:'MH-RS78XLB'};
      const wingPN = {flood:'RIG104113',spot:'RIG104213','midnight-spot':'RIG104213BLK'};
      // Front bumper
      if(hasFront(bp)&&sel['front-series']){
        const pn = frontPN(sel['front-series'], getWide(sel), sel['front-face']==='clevis');
        if(pn) parts.push({section:'Front Bumper', pn, qty:1});
        // Winch
        if(sel['front-center-winch']==='war97740') parts.push({section:'Winch', pn:'WAR97740', qty:1});
        if(sel['front-center-winch']==='war68801') parts.push({section:'Winch', pn:'WAR68801', qty:1});
        // Center light bar
        const clMap={'e-series':'RIG120313','e-midnight':'RIG120213BLK'};
        if(clMap[sel['front-center-light']]) parts.push({section:'Bumper Lights', pn:clMap[sel['front-center-light']], qty:1});
        // Wing lights
        if(wingPN[sel['front-wing-lights']]) parts.push({section:'Bumper Lights', pn:wingPN[sel['front-wing-lights']], qty:4});
        // License plate
        if(sel['front-lp']==='yes') parts.push({section:'Accessories', pn:'31910', qty:1});
        // Front hooks
        const fh=sel['front-hooks'];
        if(fh&&fh!=='none'&&hookPN[fh]) parts.push({section:'Hooks', pn:hookPN[fh], qty:2});
      }
      // Rear bumper
      if(hasRear(bp)&&sel['rear-series']){
        const pn = rearPN(sel['rear-parking']==='with', sel['rear-series'], sel['rear-face']==='clevis');
        if(pn) parts.push({section:'Rear Bumper', pn, qty:1});
        if(wingPN[sel['rear-lights']]) parts.push({section:'Bumper Lights', pn:wingPN[sel['rear-lights']], qty:2});
        const rh=sel['rear-hooks'];
        if(rh&&rh!=='none'&&hookPN[rh]) parts.push({section:'Hooks', pn:hookPN[rh], qty:2});
      }
      return parts;
    },
  };
}

const CATALOG = [

  // ─────────────────────────────────────────────────────────────
  // FORD SUPER DUTY PICKUP — 2023+ (F-250)

  withAccessories(withBumpers({

    yr_from:2023, yr_to:null,
    make:'Ford', model:'F-250 Super Duty Pickup',
    label:'F-250 Super Duty Pickup',

  year: '', make: '', model: '', platformId: '', kitId: '',
  sel: {},   // generic key→val for all step selections
};

// ═══════════════════════════════════════════════════════════════
// CATALOG HELPERS
// ═══════════════════════════════════════════════════════════════
function getPlatform(id) { return CATALOG.find(p=>p.id===id); }
function getActivePlatform() { return getPlatform(S.platformId); }
function getActiveKit() {
  const p = getActivePlatform();
  // Also search all platforms for this model in case kitId belongs to a different platform
  if(!p || !p.kits.find(k=>k.id===S.kitId)) {
    const all = getPlatformsForModel(S.year, S.make, S.model);
    for(const ap of all) { const k=ap.kits.find(k=>k.id===S.kitId); if(k) return k; }
  }
  return p ? (p.kits.find(k=>k.id===S.kitId)||null) : null;
}
function getPlatformsForModel(year, make, model) {
  const y = parseInt(year);
  if(!y||!make||!model) return [];
  return CATALOG.filter(p=>p.yr_from<=y&&(p.yr_to===null||p.yr_to>=y)&&p.make===make&&p.model===model);
}
function getAllKitsForModel() {
  return getPlatformsForModel(S.year, S.make, S.model).flatMap(p=>p.kits.map(k=>({kit:k, platformId:p.id})));
}

// Build year list from CATALOG
function getYears() {
  const now = new Date().getFullYear()+1;
  const min = Math.min(...CATALOG.map(p=>p.yr_from));
  const years = [];
  for(let y=now; y>=min; y--) {
    if(CATALOG.some(p=>p.yr_from<=y&&(p.yr_to===null||p.yr_to>=y))) years.push(y);
  }
  return years;
}

function getMakes(year) {
  const y = parseInt(year);
  const makes = [...new Set(CATALOG
    .filter(p=>p.yr_from<=y&&(p.yr_to===null||p.yr_to>=y))
    .map(p=>p.make))].sort();
  return makes;
}

function getModels(year, make) {
  const y = parseInt(year);
  return CATALOG.filter(p=>p.yr_from<=y&&(p.yr_to===null||p.yr_to>=y)&&p.make===make);
}

// ═══════════════════════════════════════════════════════════════
// YMM EVENTS
// ═══════════════════════════════════════════════════════════════
function onYear() {
  S.year = document.getElementById('sel-year').value;
  S.make=''; S.model=''; S.platformId=''; S.kitId=''; S.sel={};
  setDiscount(0);
  populateMakes(); populateModels();
  render();
}

function onMake() {
  S.make = document.getElementById('sel-make').value;
  S.model=''; S.platformId=''; S.kitId=''; S.sel={};
  setDiscount(0);
  populateModels();
  render();
}

function onModel() {
  const val = document.getElementById('sel-model').value;
  S.model = val;
  S.platformId = '';
  S.kitId = '';
  S.sel = {};
  setDiscount(0);
  const allKits = getAllKitsForModel();
  if(allKits.length===1) {
    S.platformId = allKits[0].platformId;
    S.kitId = allKits[0].kit.id;
  } else if(allKits.length>1) {
    S.platformId = getPlatformsForModel(S.year, S.make, val)[0]?.id || '';
  }
  render();
}

function populateMakes() {
  const el = document.getElementById('sel-make');
  el.innerHTML = '<option value="">— Make —</option>';
  if(!S.year){ el.disabled=true; return; }
  const makes = getMakes(S.year);
  makes.forEach(m=>{ const o=document.createElement('option'); o.value=o.textContent=m; el.appendChild(o); });
  el.disabled = makes.length===0;
  el.className = 'ymm-sel';
}

function populateModels() {
  const el = document.getElementById('sel-model');
  el.innerHTML = '<option value="">— Model —</option>';
  if(!S.year||!S.make){ el.disabled=true; return; }
  const platforms = getModels(S.year, S.make);
  // Sort: by leading number (2500 < 3500, F-250 < F-350), then alphabetically
  const sorted = [...platforms].sort((a,b)=>{
    const na=parseInt((a.model||'').match(/\d+/)?.[0])||99999;
    const nb=parseInt((b.model||'').match(/\d+/)?.[0])||99999;
    if(na!==nb) return na-nb;
    return (a.model||'').localeCompare(b.model||'');
  });
  const seen = new Set();
  sorted.forEach(p=>{
    const name = p.model;
    if(seen.has(name)) return;
    seen.add(name);
    const o=document.createElement('option'); o.value=name; o.textContent=name; el.appendChild(o);
  });
  el.disabled = seen.size===0;
  el.className = 'ymm-sel';
}

function selectKit(kitId) {
  const match = getAllKitsForModel().find(k=>k.kit.id===kitId);
  if(match) S.platformId = match.platformId;
  S.kitId = kitId;
  S.sel = {};
  render();
}

function selectStep(key, val) {
  S.sel[key] = val;
  clearDownstreamKeys(key);
  render();
}

function clearDownstreamKeys(changedKey) {
  // Smart clear: only remove a downstream selection if the step is no longer visible
  // or the saved value is no longer among the valid choices. Processed in order so
  // each cleared step updates S.sel before the next one is evaluated.
  const p = getActivePlatform();
  if(!p) return;
  let found = false;
  for(const step of p.steps) {
    if(step.key === changedKey) { found = true; continue; }
    if(!found) continue;
    const currentVal = S.sel[step.key];
    if(currentVal === undefined) continue; // already unset — nothing to do
    // Drop if step is no longer visible
    const isVisible = step.condition ? step.condition(S.sel, S.kitId) : true;
    if(!isVisible) { delete S.sel[step.key]; continue; }
    // Drop if the saved value is no longer a valid choice
    try {
      const choices = typeof step.choices === 'function'
        ? step.choices(S.kitId, S.sel)
        : step.choices;
      if(choices && !choices.some(c => c.val === currentVal)) {
        delete S.sel[step.key];
      }
    } catch(e) {
      delete S.sel[step.key]; // choices fn errored with new upstream state — clear to be safe
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
function autoSelectSingleChoiceSteps(platform) {
  let changed = false;
  for(const step of platform.steps) {
    const isVisible = step.condition ? step.condition(S.sel, S.kitId) : true;
    if(!isVisible) continue;
    if(S.sel[step.key] !== undefined) continue;
    const choices = typeof step.choices === 'function' ? step.choices(S.kitId, S.sel) : step.choices;
    if(!choices) continue;
    // Auto-select single-choice steps
    if(choices.length === 1) {
      S.sel[step.key] = choices[0].val;
      changed = true;
      continue;
    }
    // Auto-select step with a declared default value
    if(step.defaultVal !== undefined && choices.some(c => c.val === step.defaultVal)) {
      S.sel[step.key] = step.defaultVal;
      changed = true;
      continue;
    }
    // Mirror front bumper selection to matching rear step
    if(step.mirror && S.sel[step.mirror] !== undefined) {
      const mirrorVal = S.sel[step.mirror];
      if(choices.some(c => c.val === mirrorVal)) {
        S.sel[step.key] = mirrorVal;
        changed = true;
        continue;
      }
    }
    // Pre-select step default value
    if(step.default !== undefined && choices.some(c => c.val === step.default)) {
      S.sel[step.key] = step.default;
      changed = true;
    }
  }
  return changed;
}

function render() {
  const platform = getActivePlatform();
  if(platform && S.kitId) {
    let changed = true;
    while(changed) changed = autoSelectSingleChoiceSteps(platform);
  }
  renderYMM();
  renderSteps();
  renderSummary();
}

function renderYMM() {
  const yrEl = document.getElementById('sel-year');
  yrEl.className = 'ymm-sel'+(S.year?' filled':'');
  const mkEl = document.getElementById('sel-make');
  mkEl.value = S.make;
  mkEl.className = 'ymm-sel'+(S.make?' filled':'');
  const mdEl = document.getElementById('sel-model');
  mdEl.value = S.model;
  mdEl.className = 'ymm-sel'+(S.model?' filled':'');
}

function renderSteps() {
  const container = document.getElementById('steps-container');
  container.innerHTML = '';

  const platform = getActivePlatform();
  if(!platform) {
    if(S.year&&S.make&&!S.platformId) {
      container.innerHTML = '<div style="color:var(--dim);font-size:13px;padding:12px 0">Select a model above to continue.</div>';
    }
    return;
  }

  // ── Kit selection (if more than one kit across all platforms for this model) ──
  const allModelKits = getAllKitsForModel();
  if(allModelKits.length > 1) {
    const kitCard = document.createElement('div');
    kitCard.className = 'step-card'+(S.kitId?' done':'');
    kitCard.innerHTML = `
      <div class="step-hd">
        <div class="step-num">${S.kitId?'✓':'1'}</div>
        <div class="step-title">Suspension System / Lift Height</div>
        <span class="step-badge req">Required</span>
        ${S.kitId?`<span class="step-preview">${getActiveKit()?.label||''}</span>`:''}
      </div>
      <div class="step-body">
        <div class="kit-grid">
          ${allModelKits.map(({kit:k})=>`
            <div class="kit-card${S.kitId===k.id?' active':''}" onclick="selectKit('${k.id}')">
              <div class="kit-card-label">${k.label}</div>
              <div class="kit-card-sub">${k.sub||''}</div>
            </div>
          `).join('')}
        </div>
      </div>`;
    container.appendChild(kitCard);
  }

  if(!S.kitId) return;

  // ── Dynamic steps ──
  let stepNum = allModelKits.length > 1 ? 2 : 1;

  for(const step of platform.steps) {
    // Evaluate condition
    const conditionFn = step.condition;
    const isVisible = conditionFn ? conditionFn(S.sel, S.kitId) : true;
    if(!isVisible) continue;

    const val = S.sel[step.key];
    const isDone = val !== undefined;
    const choices = typeof step.choices === 'function'
      ? step.choices(S.kitId, S.sel)
      : step.choices;

    // Need prior required steps done
    const idx = platform.steps.indexOf(step);
    const prevRequired = platform.steps.slice(0, idx).filter(s=>{
      const cond = s.condition ? s.condition(S.sel, S.kitId) : true;
      return cond && s.badge==='req';
    });
    const prevDone = prevRequired.every(s=>S.sel[s.key]!==undefined);
    const isLocked = !prevDone && !isDone;

    const card = document.createElement('div');
    card.className = `step-card${isLocked?' locked':''}${isDone?' done':''}`;

    const chosenChoice = choices?.find(c=>c.val===val);
    const previewText = chosenChoice?.label||'';

    card.innerHTML = `
      <div class="step-hd">
        <div class="step-num">${isDone?'✓':stepNum}</div>
        <div class="step-title">${step.label}</div>
        <span class="step-badge ${step.badge||'opt'}">${step.badge==='req'?'Required':'Optional'}</span>
        ${isDone&&previewText?`<span class="step-preview">${previewText}</span>`:''}
      </div>
      <div class="step-body">
        ${step.hint?`<div class="step-hint">${step.hint}</div>`:''}
        <div class="rc-group">
          ${(choices||[]).map(c=>{
            const choicePrice = (c.parts||[]).reduce((s,p)=>s+price(p.pn)*p.qty,0);
            const pnList = (c.parts||[]).map(p=>`${p.pn}${p.qty>1?' ×'+p.qty:''}`).join(' · ');
            let autoPnList = '';
            if(S.kitId) {
              try {
                const selWith    = {...S.sel, [step.key]: c.val};
                const selWithout = {...S.sel, [step.key]: undefined};
                const pWith    = platform.buildParts(S.kitId, selWith);
                const pWithout = platform.buildParts(S.kitId, selWithout);
                const choicePns = new Set((c.parts||[]).map(p=>p.pn));
                // Use net quantity diff so same-P/N additions (e.g. same hook on front+rear) are counted correctly
                const withQty = {}, withoutQty = {};
                pWith.forEach(p=>{ withQty[p.pn]=(withQty[p.pn]||0)+p.qty; });
                pWithout.forEach(p=>{ withoutQty[p.pn]=(withoutQty[p.pn]||0)+p.qty; });
                const auto = Object.keys(withQty)
                  .filter(pn=>!choicePns.has(pn)&&(withQty[pn]||0)>(withoutQty[pn]||0))
                  .map(pn=>({pn,qty:withQty[pn]-(withoutQty[pn]||0)}));
                autoPnList = auto.map(p=>`${p.pn}${p.qty>1?' ×'+p.qty:''}`).join(' · ');
              } catch(e){}
            }
            // Suppress c.sub when autoPnList already shows the P/N info (avoids double display)
            const showSub = c.sub && !autoPnList;
            return `<label class="rc${val===c.val?' active':''}">
              <input type="radio" name="step-${step.key}" value="${c.val}"
                onchange="selectStep('${step.key}','${c.val}')"
                ${val===c.val?'checked':''}>
              <div>
                <div class="rc-label">${c.label}</div>
                ${showSub?`<div class="rc-sub">${c.sub}</div>`:''}
                ${choicePrice>0?`<div class="rc-price">${fmt(choicePrice)}</div>`:''}
                ${pnList?`<div class="rc-pns">${pnList}</div>`:''}
                ${autoPnList?`<div class="rc-pns">${autoPnList}</div>`:''}
              </div>
            </label>`;
          }).join('')}
        </div>
      </div>`;

    container.appendChild(card);
    stepNum++;
  }
}

function displayRef() { return _buildName || _buildRef; }

function setDiscount(val) {
  const n = parseFloat(val);
  _dealerDiscount = (!isNaN(n) && n >= 0 && n <= 100) ? n : 0;
  // Sync button active states
  document.querySelectorAll('.disc-btn').forEach(b=>{
    b.classList.toggle('active', parseFloat(b.dataset.disc||0)===_dealerDiscount);
  });
  const dr = document.getElementById('sum-dealer-row');
  if(!dr) return;
  if(_dealerDiscount > 0) {
    dr.style.display = '';
    const dp = document.getElementById('sum-dealer-price');
    if(dp) dp.textContent = fmtU(_lastTotal * (1 - _dealerDiscount/100));
    const dl = document.getElementById('sum-dealer-lbl');
    if(dl) dl.textContent = `Dealer Price (${_dealerDiscount}% off MSRP)`;
  } else {
    dr.style.display = 'none';
  }
  const hdr = document.getElementById('sum-discount-hdr-lbl');
  if(hdr) hdr.textContent = 'Dealer Discount' + (_dealerDiscount > 0 ? ` (${_dealerDiscount}% off)` : '');
}

function renderSummary() {
  const bodyEl = document.getElementById('summary-body');
  const vehicleEl = document.getElementById('sum-vehicle');
  const badgeEl = document.getElementById('build-badge');
  const refInput = document.getElementById('build-ref-input');

  const platform = getActivePlatform();
  const kit = getActiveKit();

  if(!platform||!kit) {
    vehicleEl.textContent = '';
    badgeEl.style.display = 'none';
    const cb = document.getElementById('copy-link-btn'); if(cb) cb.style.display = 'none';
    bodyEl.innerHTML = '<div class="sum-empty">Select your vehicle above to begin building your quote.</div>';
    return;
  }

  // Assemble parts — show whatever buildParts returns based on current selections
  const allParts = platform.buildParts(S.kitId, S.sel);

  // Only gate on pending required steps if nothing can be shown yet
  if(!allParts.length) {
    vehicleEl.textContent = `${S.year} ${S.make} ${platform.label}`;
    badgeEl.style.display = 'none';
    const hasPendingRequired = platform.steps.some(step => {
      if(step.badge !== 'req') return false;
      const visible = step.condition ? step.condition(S.sel, S.kitId) : true;
      if(!visible) return false;
      return S.sel[step.key] === undefined;
    });
    bodyEl.innerHTML = `<div class="sum-empty">${hasPendingRequired ? 'Complete your selections above to see your quote.' : 'Make selections to build your parts list.'}</div>`;
    return;
  }

  // Consolidate duplicate P/Ns (e.g. same hook or light on front + rear → combine qty)
  const pnMap = {};
  for(const item of allParts) {
    if(pnMap[item.pn]) { pnMap[item.pn].qty += item.qty; }
    else { pnMap[item.pn] = {...item}; }
  }

  // Group by section
  const sections = {};
  for(const item of Object.values(pnMap)) {
    if(!sections[item.section]) sections[item.section]=[];
    sections[item.section].push(item);
  }

  // Canonical section display order — suspension first, bumper accessories last
  const SECTION_ORDER = [
    'Front Suspension','Rear Suspension','Cradle Center','Lift Spacers','Radius Arms',
    'Steering Stabilizer','Air Controls','Shocks','Shocks (Included)',
    'Front Bumper','Rear Bumper','Winch',
    'Grille Guard','Grille Guard Lights','Bumper Lights','Accessories','Hooks',
  ];
  const sortedSections = Object.entries(sections).sort(([a],[b])=>{
    const ai=SECTION_ORDER.indexOf(a), bi=SECTION_ORDER.indexOf(b);
    if(ai===-1&&bi===-1) return 0;
    if(ai===-1) return 1;
    if(bi===-1) return -1;
    return ai-bi;
  });

  // Collect skipped optional steps
  const skippedOpt = platform.steps.filter(step => {
    if(step.badge !== 'opt') return false;
    const visible = step.condition ? step.condition(S.sel, S.kitId) : true;
    if(!visible) return false;
    return S.sel[step.key] === undefined;
  });

  let total = 0;
  let html = '';
  for(const [sec, items] of sortedSections) {
    html += `<div class="sum-sec"><div class="sum-sec-lbl">${sec}</div>`;
    for(const item of items) {
      const partInfo = P[item.pn]||{desc:item.pn,msrp:0};
      const lineTotal = partInfo.msrp * item.qty;
      total += lineTotal;
      html += `<div class="sum-row">
        <span class="s-pn">${item.pn}${item.qty>1?' ×'+item.qty:''}<button class="copy-pn-btn" onclick="copyPn(this,'${item.pn}')" title="Copy part number"><svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z"/></svg></button></span>
        <span class="s-desc">${partInfo.desc}</span>
        <span class="s-price">${fmt(lineTotal)}</span>
      </div>`;
    }
    html += '</div>';
  }

  if(skippedOpt.length) {
    html += `<div class="sum-sec sum-sec-skipped"><div class="sum-sec-lbl">Optional — Not Selected</div>`;
    for(const step of skippedOpt) {
      html += `<div class="sum-row sum-row-skipped">
        <span class="s-pn" style="color:var(--gold)">—</span>
        <span class="s-desc">${step.label}</span>
        <span class="s-price" style="color:var(--dim)">N/A</span>
      </div>`;
    }
    html += '</div>';
  }

  // Finish notes — finish choices don't affect P/Ns; must be called out at ordering
  const finishLabels = {'bare-steel':'Bare Steel / No Powder Coat','primer':'Primer Powder Coat','textured-black':'Textured Black Powder Coat','gloss-black':'Gloss Black Powder Coat','gloss-red':'Gloss Red Powder Coat'};
  // Suspension finish note
  const hasSuspParts = allParts.some(p=>['Front Suspension','Rear Suspension','Lift Spacers','Radius Arms','Steering Stabilizer','Air Controls','Shocks','Shocks (Included)','Cradle Center'].includes(p.section));
  if(hasSuspParts) {
    const sf = finishLabels[S.sel['susp-finish']];
    if(sf) html += `<div class="sum-finish-note">⚠ Suspension Finish: <strong>${sf}</strong> — finish does not affect part number and must be specified when ordering.</div>`;
  }
  // Bumper finish note
  const isBumperBuild = allParts.some(p=>p.section==='Front Bumper'||p.section==='Rear Bumper');
  if(isBumperBuild) {
    const frontFinish = finishLabels[S.sel['front-finish']];
    const rearFinish  = finishLabels[S.sel['rear-pu-finish']||S.sel['rear-cc-finish']];
    const hasFront = allParts.some(p=>p.section==='Front Bumper');
    const hasRear  = allParts.some(p=>p.section==='Rear Bumper');
    let finishNote = '';
    if(hasFront && hasRear && frontFinish && rearFinish && frontFinish !== rearFinish)
      finishNote = `Front: ${frontFinish} &nbsp;|&nbsp; Rear: ${rearFinish}`;
    else if(frontFinish || rearFinish)
      finishNote = frontFinish || rearFinish;
    if(finishNote) html += `<div class="sum-finish-note">⚠ Bumper Finish: <strong>${finishNote}</strong> — finish does not affect part number and must be specified when ordering.</div>`;
  }

  // Summary total, actions
  html += `</div>`;

  const vLabel = `${S.year} ${S.make} ${platform.label} — ${kit.label}`;
  vehicleEl.textContent = vLabel;
  badgeEl.style.display = '';
  const copyBtn = document.getElementById('copy-link-btn');
  if(copyBtn) copyBtn.style.display = '';
  // Only update input if user isn't currently editing it
  if(document.activeElement !== refInput) {
    refInput.value = displayRef();
    refInput.style.width = Math.max(80, Math.min(260, displayRef().length * 8 + 16)) + 'px';
  }

  _lastTotal = total;
  const _dp = _dealerDiscount > 0 ? total * (1 - _dealerDiscount/100) : null;
  const _labor = (_laborHours||0) * 150;
  const _tax = _taxExpanded ? (total + _labor) * 0.07 : 0;
  const _grand = total + _labor + _tax;
  const _showGrand = _laborExpanded || _taxExpanded;
  bodyEl.innerHTML = html +
    `<div class="sum-total">
       <span class="sum-total-label">Est. Parts MSRP</span>
       <span class="sum-total-price" id="sum-parts-total">${fmtU(total)}</span>
     </div>
     <div class="sum-collapse-hdr" id="sum-discount-hdr" onclick="toggleDiscount()">
       <span class="chdr-label" id="sum-discount-hdr-lbl">Dealer Discount${_dealerDiscount>0?` (${_dealerDiscount}% off)`:''}</span>
       <span class="sum-collapse-chevron">${_discountExpanded?'▲':'▼'}</span>
     </div>
     <div class="sum-collapse-body" id="sum-discount-body" style="${_discountExpanded?'':'display:none'}">
       <div class="sum-discount">
         ${[0,5,10,15,20,25,30].map(d=>`<button class="disc-btn${_dealerDiscount===d?' active':''}" data-disc="${d}" onclick="setDiscount(${d})">${d===0?'None':d+'%'}</button>`).join('')}
       </div>
       <div class="sum-dealer-row" id="sum-dealer-row" style="${_dp!==null?'':'display:none'}">
         <span class="sum-total-label" id="sum-dealer-lbl">Dealer Price (${_dealerDiscount||0}% off MSRP)</span>
         <span class="sum-dealer-price" id="sum-dealer-price">${_dp!==null?fmtU(_dp):''}</span>
       </div>
     </div>
     <div class="sum-collapse-hdr" onclick="toggleLabor()">
       <span class="chdr-label">+ Install Labor</span>
       <span class="sum-collapse-chevron">${_laborExpanded?'▲':'▼'}</span>
     </div>
     <div class="sum-collapse-body" id="sum-labor-body" style="${_laborExpanded?'':'display:none'}">
       <div class="sum-labor-row">
         <input id="labor-hours-input" class="sum-labor-input" type="number" min="0" step="0.5"
           value="${_laborHours||''}" placeholder="hrs"
           onclick="event.stopPropagation()"
           oninput="setLaborHours(this.value)" />
         <span class="sum-labor-eq">hrs × $150/hr =</span>
         <span class="sum-labor-cost" id="sum-labor-cost">${fmtU(_labor)}</span>
       </div>
     </div>
     <div class="sum-collapse-hdr" onclick="toggleTax()">
       <span class="chdr-label">+ Tax (7%)</span>
       <span class="sum-collapse-chevron">${_taxExpanded?'▲':'▼'}</span>
     </div>
     <div class="sum-collapse-body" id="sum-tax-body" style="${_taxExpanded?'':'display:none'}">
       <div class="sum-tax-row">
         <span class="sum-labor-eq">7% on parts + labor</span>
         <span class="sum-tax-amt" id="sum-tax-amount">${fmtU(_tax)}</span>
       </div>
     </div>
     <div class="sum-grand-total" id="sum-grand-total" style="${_showGrand?'':'display:none'}">
       <span class="sum-grand-label">Grand Total</span>
       <span class="sum-grand-price" id="sum-grand-price">${fmtU(_grand)}</span>
     </div>
     <div class="sum-note">
       All prices are MSRP. Pricing subject to change. Does not include freight.
       Build Ref: ${displayRef()}
     </div>
     <div class="sum-actions">
       <button class="btn-primary" onclick="printSummary()">Print Summary</button>
       <button class="btn-primary" onclick="copyBuildLink()" style="background:var(--dim)">Copy Link</button>
       <button class="btn-primary" onclick="showQRCode()" style="background:var(--dim)">QR Code</button>
     </div>`;
}

// ── URL compression (deflate-raw → url-safe base64) ────────────
async function _compressSel(sel) {
  const str = JSON.stringify(sel);
  if(!window.CompressionStream) return null;
  const cs = new CompressionStream('deflate-raw');
  const w = cs.writable.getWriter();
  w.write(new TextEncoder().encode(str));
  w.close();
  const buf = await new Response(cs.readable).arrayBuffer();
  let b = '';
  new Uint8Array(buf).forEach(c=>b+=String.fromCharCode(c));
  return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function _decompressSel(b64) {
  if(!window.DecompressionStream) return null;
  const bin = atob(b64.replace(/-/g,'+').replace(/_/g,'/'));
  const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
  const ds = new DecompressionStream('deflate-raw');
  const w = ds.writable.getWriter();
  w.write(bytes);
  w.close();
  const buf = await new Response(ds.readable).arrayBuffer();
  return JSON.parse(new TextDecoder().decode(buf));
}

async function decodeBuildFromURL() {
  const params = new URLSearchParams(window.location.search);
  if(!params.has('pl')) return; // nothing to restore

  S.platformId = params.get('pl') || '';
  S.kitId      = params.get('kt') || '';
  // Derive year, make, model from platform (yr/mk no longer stored in URL)
  const _rp = getPlatform(S.platformId);
  if(_rp) {
    S.year  = params.get('yr') || String(_rp.yr_from);
    S.make  = params.get('mk') || _rp.make;
    S.model = _rp.model;
  } else {
    S.year = params.get('yr') || '';
    S.make = params.get('mk') || '';
  }
  _buildName   = params.get('bn') || '';
  if(!_buildName && params.has('br')) _buildRef = params.get('br');

  // restore step selections — compressed 'q' param or legacy 's_' params
  if(params.has('q')) {
    try { S.sel = (await _decompressSel(params.get('q'))) || {}; } catch(e) { S.sel = {}; }
  } else {
    params.forEach((v,k)=>{ if(k.startsWith('s_')) S.sel[k.slice(2)] = v; });
  }

  // restore customer ref
  const cr = params.get('cr');
  if(cr) setTimeout(()=>{ const el=document.getElementById('customer-ref'); if(el) el.value=cr; }, 50);

  // update YMM dropdowns to match restored state
  if(S.year) {
    const yrEl = document.getElementById('sel-year');
    yrEl.value = S.year;
    populateMakes();
    const mkEl = document.getElementById('sel-make');
    mkEl.value = S.make;
    populateModels();
    const mdEl = document.getElementById('sel-model');
    mdEl.value = S.model;
  }
}

let _searchTimeout = null;

function onSearchInput(val) {
  const clearBtn = document.getElementById('search-clear');
  const res = document.getElementById('search-results');
  clearBtn.style.display = val ? 'block' : 'none';
  clearTimeout(_searchTimeout);
  if (!val.trim()) { res.style.display = 'none'; return; }
  _searchTimeout = setTimeout(() => runSearch(val.trim()), 120);
}

function runSearch(q) {
  const res = document.getElementById('search-results');
  const qLow = q.toLowerCase();
  const matches = Object.entries(P).filter(([pn, info]) =>
    pn.toLowerCase().includes(qLow) || info.desc.toLowerCase().includes(qLow)
  ).slice(0, 40);

  if (!matches.length) {
    res.innerHTML = '<div class="sr-none">No results for "' + q.replace(/</g,'&lt;') + '"</div>';
    res.style.display = 'block';
    return;
  }

  res.innerHTML = matches.map(([pn, info]) => {
    const price = info.msrp > 0 ? ' — $' + info.msrp.toLocaleString() : '';
    const line = '\'' + pn + '\'' + ' — ' + info.desc + (price);
    return '<div class="sr-item" onclick="copySearchResult(\'' + pn.replace(/'/g,"\\'") + '\',\'' +
      info.desc.replace(/'/g,"\\'").replace(/\n/g,' ') + '\',' + info.msrp + ')">' +
      '<div class="sr-pn">' + pn + '</div>' +
      '<div class="sr-text">' + info.desc + '</div>' +
      (info.msrp > 0 ? '<div class="sr-price">$' + info.msrp.toLocaleString() + '</div>' : '') +
      '</div>';
  }).join('');
  res.style.display = 'block';
}

function copySearchResult(pn, desc, msrp) {
  const price = msrp > 0 ? '. $' + msrp.toLocaleString() : '';
  const text = "'" + pn + "' — " + desc + price;
  navigator.clipboard.writeText(text).catch(()=>{});
  showSearchCopyToast(pn);
}

function showSearchCopyToast(pn) {
  const toast = document.getElementById('copy-toast');
  toast.textContent = pn + ' copied to clipboard!';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

function clearSearch() {
  const inp = document.getElementById('parts-search');
  const res = document.getElementById('search-results');
  const clr = document.getElementById('search-clear');
  inp.value = '';
  res.style.display = 'none';
  clr.style.display = 'none';
  inp.focus();
}

function onSearchKey(e) {
  if (e.key === 'Escape') clearSearch();
}

// Close search results when clicking outside
document.addEventListener('click', e => {
  const wrap = document.querySelector('.search-wrap');
  if (wrap && !wrap.contains(e.target)) {
    const res = document.getElementById('search-results');
    if (res) res.style.display = 'none';
  }
});

function copyPn(btn, pn) {
  navigator.clipboard.writeText(pn).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/></svg>';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z"/></svg>';
    }, 1500);
  }).catch(() => {
    // Fallback for non-HTTPS
    const ta = document.createElement('textarea');
    ta.value = pn;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.classList.add('copied');
    setTimeout(() => btn.classList.remove('copied'), 1500);
  });
}

function setView(v) {
  document.body.classList.toggle('mobile-view', v === 'mobile');
  document.getElementById('btn-desktop').classList.toggle('active', v === 'desktop');
  document.getElementById('btn-mobile').classList.toggle('active', v === 'mobile');
}
function toggleDiscountBtn() {

function refreshSummaryTotals() {

function toggleDiscount() {

function toggleLabor() {

    document.querySelectorAll('.sum-collapse-chevron')[0];

}

function setLaborHours(val) {
  const n = parseFloat(val);
  _laborHours = (!isNaN(n) && n >= 0) ? n : 0;

}

async function buildShareURL() {
  const base = window.location.href.split('?')[0];
  const params = new URLSearchParams();
  // yr and mk are derivable from pl — omit to keep URL short
  if(S.platformId) params.set('pl', S.platformId);
  if(S.kitId)      params.set('kt', S.kitId);
  if(_buildName)   params.set('bn', _buildName);
  else             params.set('br', _buildRef);
  const cr = document.getElementById('customer-ref').value.trim();
  if(cr) params.set('cr', cr);
  const q = await _compressSel(S.sel);
  if(q) {
    params.set('q', q);
  } else {
    Object.entries(S.sel).forEach(([k,v])=>{ if(v!==undefined&&v!=='') params.set('s_'+k, v); });
  }
  return base + '?' + params.toString();
}

async function copyBuildLink() {
  const url = await buildShareURL();
  try {
    await navigator.clipboard.writeText(url);
    const toast = document.getElementById('copy-toast');
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 2200);
  } catch {
    window.prompt('Copy this link:', url);
  }
}

async function showQRCode() {
  const url = await buildShareURL();
  const modal = document.getElementById('qr-modal');
  const img   = document.getElementById('qr-img');
  const lnk   = document.getElementById('qr-url-text');
  img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=280x280&margin=12&data=' + encodeURIComponent(url);
  lnk.textContent = url;
  modal.style.display = 'flex';
}

function closeQRModal() {
  document.getElementById('qr-modal').style.display = 'none';
}

function buildPrintQuote() {
  const platform = getActivePlatform();
  const kit = getActiveKit();
  if(!platform||!kit) return;

  const allParts = platform.buildParts(S.kitId, S.sel);
  if(!allParts.length) return;

  // Consolidate duplicate P/Ns
  const pnMap = {};
  for(const item of allParts) {
    if(pnMap[item.pn]) pnMap[item.pn].qty += item.qty;
    else pnMap[item.pn] = {...item};
  }

  // Section order (mirrors render())
  const SECTION_ORDER = [
    'Front Suspension','Rear Suspension','Cradle Center','Lift Spacers','Radius Arms',
    'Steering Stabilizer','Air Controls','Shocks','Shocks (Included)',
    'Front Bumper','Rear Bumper','Winch',
    'Grille Guard','Grille Guard Lights','Bumper Lights','Accessories','Hooks',
  ];
  const sections = {};
  for(const item of Object.values(pnMap)) {
    if(!sections[item.section]) sections[item.section]=[];
    sections[item.section].push(item);
  }
  const sorted = Object.entries(sections).sort(([a],[b])=>{
    const ai=SECTION_ORDER.indexOf(a),bi=SECTION_ORDER.indexOf(b);
    if(ai===-1&&bi===-1) return 0; if(ai===-1) return 1; if(bi===-1) return -1; return ai-bi;
  });

  // Build item rows
  let itemNum=1, msrpTotal=0, rows='';
  for(const [, items] of sorted) {
    for(const item of items) {
      const pi = P[item.pn]||{desc:item.pn,msrp:0};
      const line = pi.msrp*item.qty;
      msrpTotal += line;
      rows += `<tr>
        <td class="pq-col-item">${itemNum++}</td>
        <td>
          <div class="pq-item-pn">${item.pn}</div>
          <div class="pq-item-desc">${pi.desc}${item.qty>1?' &nbsp;<em>(×'+item.qty+')</em>':''}</div>
        </td>
        <td class="pq-col-qty">${item.qty}</td>
        <td class="pq-col-price">${fmt(line)}</td>
      </tr>`;
    }
  }

  // Totals
  const labor = (_laborHours||0)*150;
  const discounted = _dealerDiscount>0 ? msrpTotal*(1-_dealerDiscount/100) : null;
  const tax = _taxExpanded ? (msrpTotal+labor)*0.07 : 0;
  const hasExtras = _laborExpanded||_taxExpanded||discounted!==null;
  const grand = hasExtras ? (discounted!==null?discounted:msrpTotal)+labor+tax : null;

  let tfoot = `<tr><td class="pq-total-lbl" colspan="3">Est. MSRP Total:</td><td class="pq-total-val">${fmtU(msrpTotal)}</td></tr>`;
  if(discounted!==null) tfoot += `<tr><td class="pq-total-lbl" colspan="3">Dealer Price (${_dealerDiscount}% off MSRP):</td><td class="pq-total-val">${fmtU(discounted)}</td></tr>`;
  if(_laborExpanded&&labor>0) tfoot += `<tr><td class="pq-total-lbl" colspan="3">Install Labor (${_laborHours} hrs × $150/hr):</td><td class="pq-total-val">${fmtU(labor)}</td></tr>`;
  if(_taxExpanded) tfoot += `<tr><td class="pq-total-lbl" colspan="3">Tax (7%):</td><td class="pq-total-val">${fmtU(tax)}</td></tr>`;
  if(grand!==null) tfoot += `<tr><td class="pq-grand-lbl" colspan="3">Grand Total:</td><td class="pq-grand-val">${fmtU(grand)}</td></tr>`;

  // Dates
  const now = new Date();
  const fmtD = d => `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`;
  const exp = new Date(now); exp.setDate(exp.getDate()+30);
  const vehicle = `${S.year} ${S.make} ${platform.label}`;
  const custRef = document.getElementById('customer-ref')?.value?.trim()||'';
  const qRef = displayRef();

  // Use the actual BOSS logo image embedded in the page header
  const logoSrc = document.querySelector('.brand-logo')?.src || '';
  const logo = logoSrc
    ? `<img src="${logoSrc}" style="height:64px;width:auto;display:block;border-radius:4px">`
    : `<div style="font-family:Arial Black,Impact,sans-serif;font-size:22pt;font-weight:900;color:#111;letter-spacing:2px">BOSS</div>`;

  document.getElementById('print-quote').innerHTML = `
    <div class="pq-header">
      <div class="pq-logo">${logo}</div>
      <div class="pq-company">
        <div class="pq-company-name">Kelderman Manufacturing</div>
        2686 Hwy 92<br>Oskaloosa, IA 52577-9685<br>
        Phone: (641) 673-0468 &nbsp;·&nbsp; Fax: (641) 673-4168
      </div>
      <div class="pq-logo-spacer"></div>
    </div>
    <h1 class="pq-title">Quotation</h1>
    ${custRef?`<div class="pq-quote-to"><strong>Quote To:</strong><br>${custRef}</div>`:''}
    <table class="pq-meta-table">
      <tr>
        <td class="pq-meta-lbl">Quote Number:</td><td>${qRef}</td>
        <td class="pq-meta-lbl">Contact:</td><td>${custRef}</td>
      </tr>
      <tr>
        <td class="pq-meta-lbl">Quote Date:</td><td>${fmtD(now)}</td>
        <td class="pq-meta-lbl">Expires:</td><td>${fmtD(exp)}</td>
      </tr>
      <tr>
        <td class="pq-meta-lbl">Vehicle:</td><td colspan="3">${vehicle}</td>
      </tr>
    </table>
    <p class="pq-opener">Thank you for the opportunity to submit this quote.<br>
      <em>All prices are MSRP. Pricing subject to change. Does not include freight.</em></p>
    <table class="pq-items">
      <thead>
        <tr>
          <th class="pq-col-item">Item</th>
          <th><u>Part Number</u><br><u>Description</u></th>
          <th class="pq-col-qty">Qty</th>
          <th class="pq-col-price">Price</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
      <tfoot>${tfoot}</tfoot>
    </table>
    <div class="pq-footer">
      <p>A 25% or more deposit is required to process a quotation and begin production.</p>
      <p>A 3.5% processing fee will be applied on all credit/debit card transactions. Wire transfers, ACH payments, and checks are also approved methods of payment.</p>
      <div class="pq-sig-block">
        <div class="pq-sig-line"></div>
        <div>By Sutherland, Kasey C</div>
        <div>Kelderman Manufacturing</div>
      </div>
      <div class="pq-report-line">
        <span>Report Generated: ${now.toLocaleDateString()} ${now.toLocaleTimeString()}</span>
        <span>Page 1 of 1</span>
      </div>
    </div>`;
}

function printSummary() {
  buildPrintQuote();
  document.body.classList.add('printing-quote');
  window.print();
  setTimeout(()=>document.body.classList.remove('printing-quote'), 500);
}

// ═══════════════════════════════════════════════════════════════
// RESET
// ═══════════════════════════════════════════════════════════════
function resetAll() {
  S = { year:'', make:'', model:'', platformId:'', kitId:'', sel:{} };
  _buildRef = buildRef();
  _buildName = '';
  _dealerDiscount = 0;
  _laborHours = 0;
  _laborExpanded = false;
  _taxExpanded = false;
  _discountExpanded = false;
  history.replaceState(null,'',window.location.pathname);

  document.getElementById('sel-year').value = '';
  populateMakes();
  populateModels();
  render();
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
(async function init() {
  try {
    const yrEl = document.getElementById('sel-year');
    const yrs = getYears();
    if (!yrs || yrs.length === 0) {
      const o = document.createElement('option');
      o.value = ''; o.textContent = 'Error: no years found (CATALOG=' + (typeof CATALOG !== 'undefined' ? CATALOG.length : 'undef') + ')';
      yrEl.appendChild(o);
    } else {
      yrs.forEach(y => {
        const o = document.createElement('option');
        o.value = o.textContent = y;
        yrEl.appendChild(o);
      });
    }
    await decodeBuildFromURL();
    render();
    // Auto-apply mobile view on real phones — runs last so DOM is fully settled
    try { if(window.innerWidth < 640) setView('mobile'); } catch(e) {}
    // Belt-and-suspenders event listeners for iOS Safari (inline onchange can be unreliable)
    document.getElementById('sel-year').addEventListener('change', onYear);
    document.getElementById('sel-make').addEventListener('change', onMake);
    document.getElementById('sel-model').addEventListener('change', onModel);
  } catch(err) {
    // Show error in year select so we can diagnose on iOS without DevTools
    try {
      const yrEl = document.getElementById('sel-year');
      const o = document.createElement('option');
      o.value = ''; o.textContent = 'JS Error: ' + err.message;
      yrEl.appendChild(o);
    } catch(e2) {}
  }
})();
</script>
